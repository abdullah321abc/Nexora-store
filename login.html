<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Nexora Store</title>

   <link rel="stylesheet" href="./style.css">
    

</head>

<body>

    <header class="site-header">
        <div class="header-content container">
            <a href="../index.html" class="logo">
                <span class="logo-icon">🎮</span>
                <span class="logo-text">
                    <strong>NEXORA STORE</strong>
                    <small>The Future of Apps.</small>
                </span>
            </a>
        </div>
    </header>

    <main class="container main-content">

        <section class="section-block">
            <div class="section-heading">
                <span class="eyebrow">WELCOME BACK</span>
                <h1>Login to Nexora Store</h1>
                <p class="section-description">
                    Sign in to access your gaming profile.
                </p>
            </div>

            <div class="profile-card login-card">

                <div class="profile-avatar">👤</div>

                <form id="loginForm">

                    <div class="form-group">
                        <label for="loginEmail">Email address</label>
                        <input
                            type="email"
                            id="loginEmail"
                            name="email"
                            placeholder="you@example.com"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <input
                            type="password"
                            id="loginPassword"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <button type="submit" class="primary-button">
                        Login 🚀
                    </button>

                    <p id="loginMessage" class="form-message"
                       role="status" aria-live="polite"></p>

                </form>

                <div class="login-links">
                    <p>
                        Don't have an account?
                        <a href="signup.html" class="text-link">
                            Sign up
                        </a>
                    </p>

                    <a href="../index.html" class="text-link">
                        ← Back to Home
                    </a>
                </div>

            </div>
        </section>

    </main>

    <nav class="bottom-nav">
        <a href="../index.html" class="nav-item">
            <span class="nav-icon">🏠</span>
            <span>Home</span>
        </a>

        <a href="search.html" class="nav-item">
            <span class="nav-icon">🔍</span>
            <span>Search</span>
        </a>

        <a href="upload.html" class="nav-item">
            <span class="nav-icon">📤</span>
            <span>Upload</span>
        </a>

        <a href="profile.html" class="nav-item">
            <span class="nav-icon">👤</span>
            <span>Profile</span>
        </a>
    </nav>

    <footer class="site-footer">
        <p>© <span id="currentYear"></span> Nexora Store.</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/script.js"></script>

</body>
</html>
